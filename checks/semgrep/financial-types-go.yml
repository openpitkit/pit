# Domain types for financial values (Go).
#
# Source: the project style contract - each binding carries its own value types
# with the same semantics as the core, and a floating-point type is never a
# financial value. Deliberately not keyed on field names: a rule matching only
# price, amount or qty misses every field named otherwise, so the scope is the
# package.
#
# bindings/go/param holds the value types and the boundary constructors that
# take an external float and convert immediately; bindings/go/internal/native is
# the C ABI seam, where the representation is dictated by the generated header.
# Both are out of scope.

rules:
  - id: financial-value-must-use-domain-type-go
    message: >-
      Financial values use a domain type from the param package, never float64.
      If no domain type expresses this value, that is a defect in the domain
      model - file it and fix the model rather than bypassing it here.
    severity: ERROR
    languages: [go]
    pattern-either:
      - pattern: |
          type $S struct {
            ...
            $F float64
            ...
          }
      - pattern: |
          func $FN(..., $A float64, ...) $R { ... }
      - pattern: |
          func $FN(...) float64 { ... }
      - pattern: |
          func ($R $T) $FN(..., $A float64, ...) $RET { ... }
    paths:
      include:
        - /bindings/go/model/**
        - /bindings/go/pretrade/**
        - /bindings/go/marketdata/**
        - /bindings/go/accounts/**
        - /bindings/go/accountadjustment/**
        - /bindings/go/reject/**
        - /bindings/go/tx/**
        - /bindings/go/configure/**
        - /bindings/go/asyncengine/**
      exclude:
        - "**/*_test.go"

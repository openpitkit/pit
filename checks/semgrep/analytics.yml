# Analytics hygiene: only a deployed site reports.
#
# A page opened anywhere else - a local run, a preview deployment, a fork, a
# page opened as a file or a data: URL - would otherwise send its visit to the
# production project, mixed in with real visitors.

rules:
  - id: posthog-init-outside-host-guard
    message: >-
      PostHog must start only on the deployed host. Call posthog.init inside a
      check of location.hostname against the production host, or after an
      early return when the host differs.
    severity: ERROR
    languages: [javascript, typescript]
    patterns:
      - pattern: posthog.init(...)
      - pattern-not-inside: |
          if (location.hostname === $HOST) { ... }
      - pattern-not-inside: |
          if (<... window.location.hostname !== $HOST ...>) { return; }
          ...

  - id: no-inline-posthog-init
    message: >-
      Start PostHog from a script file, not from an inline script: the host
      check lives there once, and the rule above cannot see JavaScript embedded
      in markup.
    severity: ERROR
    languages: [generic]
    # An inline script element (no src attribute) whose body calls init.
    pattern-regex: '<script\b(?![^>]*\bsrc=)[^>]*>(?:(?!</script>)[\s\S])*?posthog\.init\('

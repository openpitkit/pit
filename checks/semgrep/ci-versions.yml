# CI version pins.
#
# Under .github/, .github/ci-versions.env is read in one place: the
# load-ci-versions composite action, which checks every pin the job names
# before the file reaches GITHUB_ENV. Any other read there - an inline
# `cat ... >> "$GITHUB_ENV"`, a `source`, a redirect - skips that check, and a
# setup action handed an empty version input silently keeps the runner's own
# tool. The justfile and scripts/just_helpers.py read single pins for their
# own version checks; they fail on a missing pin and are outside this rule.

rules:
  - id: ci-versions-read-outside-loader
    message: >-
      CI loads .github/ci-versions.env only through the load-ci-versions
      action: `uses: ./.github/actions/load-ci-versions` with `required:`
      listing the CI_* names the job reads. A direct read skips the check that
      each of those pins is present and non-empty.
    severity: ERROR
    languages: [generic]
    # Every line that names the file counts as a read, except a whole-line
    # comment and a `description:` value, which name it in prose.
    pattern-regex: '^(?![ \t]*(#|description:)).*ci-versions\.env'
    paths:
      include:
        - /.github/**
      exclude:
        # The loader is the one place that reads the file.
        - /.github/actions/load-ci-versions/**

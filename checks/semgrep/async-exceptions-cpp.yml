rules:
  - id: async-cpp-dropped-exception
    message: >-
      A catch-all must propagate, terminate, capture the exception, or report
      it through a promise/result. Document approved containment with a reason
      on an explicit nosemgrep suppression.
    severity: ERROR
    languages: [cpp]
    patterns:
      - pattern: |
          try { ... } catch (...) { ... }
      - pattern-not: |
          try { ... } catch (...) { ... throw; ... }
      - pattern-not: |
          try { ... } catch (...) { ... std::rethrow_exception(...); ... }
      - pattern-not: |
          try { ... } catch (...) { ... std::terminate(); ... }
      - pattern-not: |
          try { ... } catch (...) { ... std::current_exception(); ... }
      - pattern-not: |
          try { ... } catch (...) { ... $PROMISE.Fail(...); ... }
      - pattern-not: |
          try { ... } catch (...) { ... $PROMISE->Fail(...); ... }
      - pattern-not: |
          try { ... } catch (...) { ... $PROMISE.set_exception(...); ... }
      - pattern-not: |
          try { ... } catch (...) { ... $PROMISE->set_exception(...); ... }
    paths:
      include:
        - /bindings/cpp/include/openpit/asyncengine/**

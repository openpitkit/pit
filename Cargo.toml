[workspace]
resolver = "2"
members = [
    "bindings/js",
    "bindings/python",
    "crates/openpit",
    "crates/openpit-derive",
    "crates/openpit-ffi",
    "crates/openpit-interop",
]

[workspace.metadata.release]
shared-version = true
consolidate-commits = true
tag-prefix = ""
tag-message = "Release {{version}}"
pre-release-commit-message = "Release {{version}}"
push = false
publish = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# On macOS this pass is replaced by link-time stripping, see .cargo/config.toml.
strip = "symbols"
panic = "abort"

name: Diagnose Windows release image

on:
  push:
    paths:
      - .github/workflows/windows-image-diagnostics.yml
      - e2e/diagnose-windows-image.ps1
  workflow_dispatch:
    inputs:
      base_image:
        description: .NET Framework runtime image pinned by its sha256 digest
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose Build Tools installation and layer import
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Docker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dockerService = Get-Service docker -ErrorAction Stop
          if ($dockerService.Status -ne 'Running') {
            Start-Service docker
          }
          $dockerService.WaitForStatus('Running', '00:00:30')

      - name: Reproduce failed release image on push
        if: ${{ github.event_name == 'push' }}
        shell: powershell
        env:
          BASE_IMAGE: mcr.microsoft.com/dotnet/framework/runtime@sha256:c4f6c4df71af3cad6276cafce92789d62857dcbdd50da20c5636e4b117320e99
        run: |
          .\e2e\diagnose-windows-image.ps1 `
            -BaseImage $env:BASE_IMAGE `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'openpit-windows-image-diagnostics')

      - name: Reproduce requested image manually
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: powershell
        env:
          BASE_IMAGE: ${{ inputs.base_image }}
        run: |
          .\e2e\diagnose-windows-image.ps1 `
            -BaseImage $env:BASE_IMAGE `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'openpit-windows-image-diagnostics')

      - name: Upload diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-image-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openpit-windows-image-diagnostics
          if-no-files-found: error
          retention-days: 7

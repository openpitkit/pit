name: Setup wasm toolchain
description: Install the pinned Rust, Node and wasm-bindgen-cli that build the JS/WASM package; their versions are loaded from .github/ci-versions.env here.

inputs:
  registry-url:
    description: Registry passed to actions/setup-node; empty configures none.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # The versions below come from .github/ci-versions.env, loaded here so the
    # caller need not. With an empty version setup-node silently keeps the
    # runner's Node, so the loader fails on a missing or empty pin instead.
    - name: Load CI versions
      uses: ./.github/actions/load-ci-versions
      with:
        required: CI_RUST CI_NODE

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ env.CI_RUST }}
        targets: wasm32-unknown-unknown

    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.CI_NODE }}
        cache: npm
        cache-dependency-path: bindings/js/package-lock.json
        registry-url: ${{ inputs.registry-url }}

    - name: Resolve wasm-bindgen-cli version
      id: wasm-bindgen
      shell: bash
      run: |
        set -euo pipefail
        # Pin the CLI to the exact wasm-bindgen version the crate resolves to
        # (bindings/js/Cargo.toml: wasm-bindgen = "=0.2.x"), so the generated
        # bindings never drift from the runtime crate.
        VERSION="$(
          awk '/^wasm-bindgen[[:space:]]*=/ {
                 match($0, /[0-9]+\.[0-9]+\.[0-9]+/); print substr($0, RSTART, RLENGTH); exit
               }' bindings/js/Cargo.toml
        )"
        if [[ -z "${VERSION}" ]]; then
          echo "::error::could not resolve the wasm-bindgen version from bindings/js/Cargo.toml"
          exit 1
        fi
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

    - name: Install wasm-bindgen-cli
      uses: taiki-e/install-action@v2
      with:
        tool: wasm-bindgen-cli@${{ steps.wasm-bindgen.outputs.version }}

# cargo-about settings for THIRD-PARTY-LICENSES (`just gen-third-party-licenses`).

# Resolution order for a dual-licensed crate: Apache-2.0 first, because the
# project ships its text as LICENSE anyway.
accepted = ["Apache-2.0", "MIT", "Unicode-3.0"]

# Every platform a binary is released for, so platform-only crates are covered.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "wasm32-unknown-unknown",
]

# Neither kind ends up in a shipped binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true

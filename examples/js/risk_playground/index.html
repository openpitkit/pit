  <script>
    (() => {
      const key = "openpit-playground-theme";
      let stored = null;
      try {
        stored = localStorage.getItem(key);
      } catch (error) {
        // fallback(approved): blocked storage must not break the page; the theme is a convenience
        console.warn("theme preference unreadable, using the system theme", error);
      }
      const theme = stored === "light" || stored === "dark" || stored === "system"
        ? stored
        : "system";
      const resolved = theme === "system"
        ? matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        : theme;
      document.documentElement.classList.add(resolved);
      document.documentElement.style.colorScheme = resolved;
      const favicon = document.querySelector("link[data-theme-favicon]");
      const themeColor = document.querySelector("meta[data-theme-color]");
      if (favicon !== null) favicon.href = `./favicon-${resolved}.svg`;
      if (themeColor !== null) {
        themeColor.content = resolved === "dark" ? "#0a0d12" : "#f6f3ec";
      }
    })();
  </script>
